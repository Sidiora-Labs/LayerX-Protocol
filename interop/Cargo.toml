[workspace]
members = [
    "crates/layerx-interop-gateway",
    "crates/layerx-fiat",
    "crates/layerx-migrate",
    "crates/layerx-ucp",
    "crates/layerx-x402",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "LicenseRef-Centra-ai-Protocol"

[workspace.dependencies]
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
layerx-types = { path = "../agent/crates/layerx-types" }
layerx-wire = { path = "../agent/crates/layerx-wire" }
layerx-crypto = { path = "../agent/crates/layerx-crypto" }
layerx-proof = { path = "../agent/crates/layerx-proof" }
layerx-interop-gateway = { path = "crates/layerx-interop-gateway" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
