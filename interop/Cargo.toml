[workspace]
members = [
    "crates/layerx-interop-gateway",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "LicenseRef-Centra-ai-Protocol"

[workspace.dependencies]
ed25519-dalek = "=2.2.0"
layerx-types = { path = "../agent/crates/layerx-types" }
layerx-wire = { path = "../agent/crates/layerx-wire" }
layerx-crypto = { path = "../agent/crates/layerx-crypto" }
layerx-proof = { path = "../agent/crates/layerx-proof" }
sha2 = "=0.10.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
