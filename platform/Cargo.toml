[workspace]
members = [
    "emulator",
    "sdk/generators",
    "release",
    "tools/kvx",
    "tools/workspace-gate",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "LicenseRef-Centra-ai-Protocol"

[workspace.dependencies]
layerx-platform-kvx = { path = "tools/kvx", version = "=0.1.0" }
sha2 = "=0.10.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"
